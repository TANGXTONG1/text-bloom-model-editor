name: 功能建议
description: 建议新功能、装饰素材或打印流程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想做什么模型，现在卡在哪里？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方式
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 编辑体验
        - 装饰素材
        - SVG / PNG 导入
        - 几何与网格
        - 3MF / Bambu Studio
        - 部署与文档
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: 素材确认
      options:
        - label: 建议不依赖无授权商标、字体、角色或第三方模型。
          required: true
